[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qchunk-reimplementation"
version = "0.1.0"
description = "From-scratch implementation of Q-chunking"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "imageio",
    "jax[cuda12]",
    "flax",
    "optax",
    "PyYAML",
    "ogbench==1.1.2",
    "gymnasium==1.1.1",
    "mujoco==3.3.1",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]

[dependency-groups]
dev = [
    "modal==1.6.2",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
