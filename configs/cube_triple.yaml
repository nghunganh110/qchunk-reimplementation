seed: 0

environment:
  name: cube-triple-play-singletask-task2-v0
  dataset_dir: null
  action_clip_eps: 1.0e-5

agent:
  horizon: 5
  hidden_dims: [512, 512, 512, 512]
  num_critics: 2
  num_candidates: 32
  num_flow_steps: 10
  discount: 0.99
  tau: 0.005
  learning_rate: 3.0e-4
  q_aggregation: mean
  flow_layer_norm: false
  critic_layer_norm: true

offline:
  steps: 1000000
  batch_size: 256
  log_interval: 5000
  dataset_seed: 0
  checkpoint_interval: 50000

online:
  steps: 1000000
  buffer_capacity: 2000000
  batch_size: 256
  start_training: 5000
  updates_per_step: 1
  log_interval: 5000
  evaluation_interval: 100000
  replay_seed: 1
  policy_seed: 1
  environment_seed: 1

evaluation:
  episodes: 50
  seed: 42

output:
  checkpoint: runs/cube_triple/offline_final.msgpack
  checkpoint_dir: runs/cube_triple/checkpoints
  online_checkpoint: runs/cube_triple/online_final.msgpack
